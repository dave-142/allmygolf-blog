name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install packages
        run: npm ci
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      # Processed images from earlier runs, so only new photos are resized
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/uploads/**') }}
          restore-keys: astro-images-
      - name: Build site
        run: npm run build
      - name: Point image links at Blob Storage
        run: node scripts/use-image-host.js
        env:
          IMAGE_HOST: https://saallmygolfblogprod.blob.core.windows.net/images
      # Images are served from Blob Storage. Files already there are skipped, since names change when an image does
      - name: Upload images to Blob Storage
        env:
          IMAGES_SAS_URL: ${{ secrets.IMAGES_SAS_URL }}
        run: |
          if ! command -v azcopy > /dev/null; then
            curl -sL https://aka.ms/downloadazcopy-v10-linux | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/azcopy'
          fi
          # Put the files in an _astro folder, matching the paths the pages use
          DEST="${IMAGES_SAS_URL%%\?*}/_astro?${IMAGES_SAS_URL#*\?}"
          azcopy copy "dist/_astro/*" "$DEST" \
            --include-pattern "*.webp;*.jpg;*.jpeg;*.png" \
            --overwrite=false \
            --cache-control "public, max-age=31536000, immutable"
      - name: Remove images from the deploy
        run: find dist/_astro -type f \( -name '*.webp' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -delete
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_HILL_0FCDE470F }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Already built by the steps above
          api_location: "api" # Api source code path - optional
          output_location: "" # The built site is app_location itself
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
