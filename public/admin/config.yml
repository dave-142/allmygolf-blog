local_backend: true
backend:
  name: github
  repo: dave-142/allmygolf-blog
  branch: main
  base_url: https://www.allmy.golf
  auth_endpoint: api/auth

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

collections:
  - name: blog
    label: Posts
    folder: src/content/blog
    create: true
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - label: Gallery
        name: gallery
        label_singular: Photo
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image, allow_multiple: false }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Date, name: pubDate, widget: datetime }
      - label: Type
        name: type
        widget: select
        options: [round, equipment]
        default: round
      - label: Course
        name: course
        widget: relation
        collection: courses
        file: courses
        search_fields: ["courses.*.name"]
        display_fields: ["courses.*.name"]
        value_field: "courses.*.id"
        required: false
      - { label: Score, name: score, widget: number, value_type: int, required: false }
      - { label: Rating (1 to 5), name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
      - { label: Verdict, name: verdict, widget: string, required: false }
      - label: Round notes
        name: roundNotes
        widget: object
        collapsed: true
        required: false
        hint: Rounds only. Answer the ones you have something for and skip the rest.
        fields:
          - label: Purpose
            name: purpose
            widget: string
            required: false
            hint: What the round was for, e.g. Working on my driving, Club medal.
          - label: The hole worth knowing
            name: holeWorthKnowing
            widget: object
            required: false
            fields:
              - { label: Hole number, name: hole, widget: number, value_type: int, min: 1, max: 36, required: false }
              - label: How I'd play it next time
                name: note
                widget: text
                required: false
                hint: A few sentences.
          - { label: Best shot, name: bestShot, widget: text, required: false, hint: A sentence or two. }
          - { label: Worst shot, name: worstShot, widget: text, required: false, hint: A sentence or two. }
          - label: Next time I'd
            name: nextTime
            widget: text
            required: false
            hint: The one thing you'd do differently.
          - label: Conditions
            name: conditions
            widget: text
            required: false
            hint: Wind, greens, how the course was playing.
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown, required: false }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }
  - name: courses
    label: Courses
    files:
      - name: courses
        label: Courses
        file: src/data/courses.json
        fields:
          - label: Courses
            name: courses
            label_singular: Course
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 'ID (URL slug, for example north-berwick)', name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and hyphens only'] }
              - { label: Name, name: name, widget: string }
              - { label: 'Town (only used to look up coordinates)', name: town, widget: string, required: false }
              - { label: Latitude, name: lat, widget: number, value_type: float, required: false }
              - { label: Longitude, name: lng, widget: number, value_type: float, required: false }
              - { label: Par, name: par, widget: number, value_type: int, required: false }
              - { label: Holes, name: holes, widget: number, value_type: int, required: false }
              - { label: Yardage, name: yardage, widget: number, value_type: int, required: false }
