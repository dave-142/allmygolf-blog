backend:
  name: github
  repo: dave-142/allmygolf-blog
  branch: main
  base_url: https://www.allmy.golf
  auth_endpoint: api/auth

# Uploads live in src/assets so Astro can optimise them. Sveltia needs the global public_folder to start with "/",
# so the relative path Astro needs (../../assets/uploads, from a post) is set on the Posts collection below
media_folder: /src/assets/uploads
public_folder: /src/assets/uploads

# Photos are shrunk in the browser before upload: converted to WebP and fitted inside 2048 x 2048.
# That covers the largest size the site serves (2000px wide), and Astro makes the smaller sizes at build time
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

collections:
  - name: blog
    label: Posts
    folder: src/content/blog
    create: true
    extension: md
    media_folder: /src/assets/uploads
    public_folder: ../../assets/uploads
    # How each post is labelled in the post list and search results. The date tells same-course rounds apart
    summary: "{{pubDate | date('D MMM YYYY')}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - label: Gallery
        name: gallery
        label_singular: Photo
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Date, name: pubDate, widget: datetime }
      - label: Type
        name: type
        widget: select
        options: [round, equipment]
        default: round
      - label: Course
        name: course
        widget: relation
        collection: courses
        file: courses
        search_fields: ["courses.*.name"]
        display_fields: ["courses.*.name"]
        value_field: "courses.*.id"
        required: false
      - { label: Score, name: score, widget: number, value_type: int, required: false }
      - { label: Rating (1 to 5), name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
      - { label: Verdict, name: verdict, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: markdown, required: false }
  - name: courses
    label: Courses
    files:
      - name: courses
        label: Courses
        file: src/data/courses.json
        fields:
          - label: Courses
            name: courses
            label_singular: Course
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: 'ID (URL slug, for example north-berwick)', name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and hyphens only'] }
              - { label: Name, name: name, widget: string }
              - { label: 'Town (only used to look up coordinates)', name: town, widget: string, required: false }
              - { label: Latitude, name: lat, widget: number, value_type: float, required: false }
              - { label: Longitude, name: lng, widget: number, value_type: float, required: false }
              - { label: Par, name: par, widget: number, value_type: int, required: false }
              - { label: Holes, name: holes, widget: number, value_type: int, required: false }
              - { label: Yardage, name: yardage, widget: number, value_type: int, required: false }
